<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f2f1eb">
    <title>Page not found — Abdullah Nettoor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f2f1eb; color: #102c27; font: 16px/1.5 system-ui, sans-serif; }
        main { width: min(760px, 100%); padding: clamp(32px, 8vw, 80px); border-radius: 28px; background: #e5ba62; }
        span { font: 12px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; }
        h1 { max-width: 8ch; margin: 64px 0 24px; font-size: clamp(48px, 10vw, 88px); line-height: .92; letter-spacing: -.04em; }
        p { max-width: 40ch; }
        a { display: inline-block; margin-top: 30px; padding: 12px 16px; border-radius: 8px; background: #102c27; color: white; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid #e66248; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <span>404 · Wrong room</span>
        <h1>Nothing was built here.</h1>
        <p>The page may have moved, or the address may be incomplete.</p>
        <a href="/">Return to the portfolio</a>
    </main>
</body>
</html>
